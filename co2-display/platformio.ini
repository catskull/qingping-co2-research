[env:tdisplay]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem21201
monitor_port = /dev/cu.usbmodem21201
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    moononournation/GFX Library for Arduino@1.6.9

; Glyph preview: buttons step the CO2 readout through 0000..9999 and dashes. `pio run -e preview -t upload`
[env:preview]
extends = env:tdisplay
build_flags =
    ${env:tdisplay.build_flags}
    -DDIGIT_PREVIEW
