[env:qingping]
platform = espressif32
board = esp32dev
framework = arduino
; Wi-Fi + BLE needs more than the default 1.25 MB app slots; this keeps two OTA slots of ~1.9 MB.
board_build.partitions = min_spiffs.csv
; This unit's factory-MAC eFuse fails its CRC; PHY init reads it directly and aborts.
; Route every caller through __wrap_esp_efuse_mac_get_default (src/efuse_mac_fix.cpp).
build_flags =
    -Wl,--wrap=esp_efuse_mac_get_default
; NimBLE is far smaller than the core's Bluedroid-based BLE library.
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/cu.usbserial-A5069RR4
monitor_port = /dev/cu.usbserial-A5069RR4
; Board has no auto-reset circuit: put it in download mode by hand (hold IO0, tap EN).
upload_flags =
    --before=no_reset
    --after=no_reset
